# MongoDB + HBase (with Thrift) for the project.
#   docker compose up -d
#   docker compose exec hbase hbase shell /project/part1_hbase/schema.hbase   (optional:
#   load_hbase.py also creates the tables through Thrift)
services:
  mongodb:
    image: mongo:7
    container_name: ecom-mongodb
    ports: ["27017:27017"]
    command: ["--wiredTigerCacheSizeGB", "1.5"]
    volumes: [mongo-data:/data/db]

  hbase:
    # Standalone HBase 2.1 with ZooKeeper, Master, RegionServer and the Thrift server
    # (port 9090, used by happybase). Web UI: http://localhost:16010
    image: harisekhon/hbase:2.1
    container_name: ecom-hbase
    hostname: hbase
    ports: ["9090:9090", "16010:16010", "2181:2181"]
    volumes: [".:/project"]

volumes:
  mongo-data:
